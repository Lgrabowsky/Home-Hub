name: CI

# Type-checks and tests the hub and the web app on every push, and builds the
# container image. Images are published to the GitHub Container Registry for the
# default branch (tag "latest") and for version tags (v1.2.3).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Hub tests
        run: npm run test -w hub

      - name: Build
        run: npm run build

  e2e:
    # The built hub in demo mode (simulated devices, real integrations) driven through a browser.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg and go2rtc (live video)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          if curl -fsSL -o "$RUNNER_TEMP/go2rtc" https://github.com/AlexxIT/go2rtc/releases/download/v1.9.15/go2rtc_linux_amd64; then
            chmod +x "$RUNNER_TEMP/go2rtc"
            echo "GO2RTC_BIN=$RUNNER_TEMP/go2rtc" >> "$GITHUB_ENV"
          else
            echo "::warning::go2rtc could not be downloaded - the live-video tests will be skipped"
          fi

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e -w web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  windows-package:
    # Home Hub for a Windows PC: unzip and double-click (see deploy/windows/LIESMICH.txt).
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build go2rtc for Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go install -trimpath -ldflags "-s -w" github.com/AlexxIT/go2rtc@v1.9.15
          echo "GO2RTC_WINDOWS_BIN=$(go env GOPATH)/bin/windows_amd64/go2rtc.exe" >> "$GITHUB_ENV"

      - name: Package
        run: node scripts/package-windows.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: HomeHub-Windows
          path: dist-windows/HomeHub
          retention-days: 30

  windows-smoke:
    # The package on a real Windows machine: the scripts parse in both PowerShells, the hub starts
    # with its own certificate, and Windows itself accepts that certificate (name constraints included).
    needs: windows-package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: HomeHub-Windows
          path: HomeHub

      - name: Scripts parse (PowerShell 7)
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem HomeHub -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "$($file.Name):$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }

      - name: Scripts parse (Windows PowerShell 5.1, what double-clicking uses)
        shell: powershell
        run: |
          foreach ($file in Get-ChildItem HomeHub -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "$($file.Name):$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }

      - name: Hub answers over HTTPS with a certificate Windows trusts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HUB_TLS = 'auto'
          $env:HUB_TLS_DIR = Join-Path $env:RUNNER_TEMP 'cert'
          $env:HUB_DATA_DIR = Join-Path $env:RUNNER_TEMP 'data'
          $env:HUB_DEMO = '1'
          $env:HUB_MEDIA = '0'
          $env:HUB_HOST = '127.0.0.1'
          $hubJs = Join-Path $PWD 'HomeHub\app\hub\dist\index.js'
          $prepared = & node $hubJs --prepare-tls | ConvertFrom-Json
          Write-Host "Zertifikat: $($prepared.fingerprint) für $($prepared.names -join ', ')"
          # The runner is an administrator: the machine store needs no confirmation dialog.
          Import-Certificate -FilePath $prepared.caFile -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $log = Join-Path $env:RUNNER_TEMP 'hub.log'
          $hub = Start-Process node -ArgumentList "`"$hubJs`"" -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          try {
            $health = $null
            for ($i = 0; $i -lt 60 -and -not $health; $i++) {
              Start-Sleep -Seconds 1
              try { $health = Invoke-WebRequest -UseBasicParsing -Uri 'https://localhost:8443/api/health' } catch { }
            }
            if (-not $health) { Get-Content $log, "$log.err" -ErrorAction SilentlyContinue; throw 'Keine https-Antwort mit Windows-Zertifikatsprüfung' }
            Write-Host "https://localhost:8443 → $($health.StatusCode) $($health.Content)"
            Invoke-WebRequest -UseBasicParsing -Uri 'https://127.0.0.1:8443/api/bootstrap' | Out-Null
            $page = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8080/'
            if ($page.Content -notmatch [regex]::Escape($prepared.fingerprint)) { throw 'Zertifikatsseite ohne Fingerabdruck' }
            $redirect = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8080/api/auth/me' -MaximumRedirection 0 -ErrorAction SilentlyContinue
            if ($redirect.StatusCode -ne 308) { throw "http leitet nicht auf https um ($($redirect.StatusCode))" }
          } finally {
            Stop-Process -Id $hub.Id -Force -ErrorAction SilentlyContinue
          }

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Other branches only prove that the image still builds (one platform, nothing published).
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
